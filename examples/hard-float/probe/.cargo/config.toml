# The bare target: the stock one every other guest uses. Its floating point is software.
[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "code-model=large",
  "-C", "link-arg=-T../../../store/games/flux-rink/guest.ld",
  "-C", "link-arg=--build-id=none",
  "-C", "link-arg=-z",
  "-C", "link-arg=max-page-size=4096",
]

# The same program for the tier-1 Linux target, linked with no C library and the same script.
# The target's own core and alloc use SSE2, so the target, core and alloc agree.
[target.x86_64-unknown-linux-gnu]
linker = "ld"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "code-model=large",
  "-C", "link-arg=-T../../../store/games/flux-rink/guest.ld",
  "-C", "link-arg=--build-id=none",
  "-C", "link-arg=-z",
  "-C", "link-arg=max-page-size=4096",
  "-C", "link-arg=-static",
  "-C", "link-arg=-nostdlib",
]
