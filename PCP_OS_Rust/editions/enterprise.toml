# PCP OS | Enterprise Edition | DESIGN MANIFEST. No image is built from this file yet.
# The kernel, the integrity core and every safety control are the same bytes in all three editions.
# An edition selects optional components and states who is licensed; it never removes a control.

edition = "ENTERPRISE"
licensed_to = "an organization, its platforms and affiliates under a signed agreement"
topology = "fleets, integration into the licensee's systems, exchange between organizations"

[base]                       # identical in every edition, and all that is installed by default
kernel = "pcpos-kernel"
integrity_core = "pcpos-core"
services = ["registrar", "store", "calibrator", "agent-runtime", "shell"]
method = "ACR Implementation packet, exact release pinned by digest"
network_listeners_enabled = []          # nothing listens by default
graphical_interface = false             # not installed by default
toolchains = ["rust", "c", "c++", "python"]   # installed by default wherever the system can run them; see [toolchains]
browser = "none"                        # not installed by default

[optional]                   # installed only when the person directing the system selects them
profiles = ["development", "graphical", "foreign-programs"]
edition_components = ["identity-directory", "shared-register", "remote-attestation", "fleet-policy", "embedding-interface"]

[toolchains]                 # Rust takes primacy: the system and its tools are written in it, and its implementation is the authority
installed = ["rust", "c", "c++", "python"]
reachable_from = "the development realm only; a production realm holds no capability to a compiler or an interpreter"
on_the_native_kernel = "not yet: each needs the service that hosts existing programs"

[standard]                   # the installation's policy; it narrows what the method allows and never widens it
available = "a floor set by the organization for every installation; an installation may be stricter, never laxer"
method = "native by default; a pinned packet release by recorded choice where the standard allows"

[authority]                  # identities, roles and groups are policy; the kernel knows capabilities only
roles = ["PRINCIPAL", "ADMINISTRATOR", "DIRECTOR", "REVIEWER", "AUTHOR", "OPERATOR", "AUDITOR"]
separation = "whoever administers does not assess; an auditor writes nothing"

[invariants]                 # checked at build and at start; an image that fails one does not start
writable_and_executable_memory = "never"
register = "append-only, hash-chained, written only through the registrar"
halt = "accepted in every state in which anything runs; never refused"
completion = "a task is done only when its result is in the record"
model_authority = "a model holds only the capabilities it was handed"
unsigned_code_in_production = "refused"
