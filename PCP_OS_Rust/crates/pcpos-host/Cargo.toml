[package]
name = "pcpos-host"
description = "PCP OS tools for other operating systems, built on the same integrity core as the kernel."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "pcpos-verify"
path = "src/main.rs"

[[bin]]
name = "pcpos"
path = "src/pcpos.rs"

[[bin]]
name = "pcpos-vectors"
path = "src/vectors.rs"

[dependencies]
pcpos-core = { path = "../pcpos-core" }
num-bigint = { version = "=0.4.6", default-features = false }
num-integer = { version = "=0.1.47", default-features = false }
plotters-backend = { version = "=0.3.7", default-features = false }
plotters-svg = { version = "=0.3.7", default-features = false }
