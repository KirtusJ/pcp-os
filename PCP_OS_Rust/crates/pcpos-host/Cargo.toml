[package]
name = "pcpos-host"
description = "PCP OS tools for other operating systems, built on the same integrity core as the kernel."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "pcpos-verify"
path = "src/main.rs"

[[bin]]
name = "pcpos"
path = "src/pcpos.rs"

[[bin]]
name = "pcpos-vectors"
path = "src/vectors.rs"

[dependencies]
pcpos-core = { path = "../pcpos-core" }

# Windows only: the link count and the identity of an opened file, which the standard library does not yet
# give to safe code there. winapi-util is a safe wrapper over Microsoft's windows-sys bindings. Nothing is
# added to the dependencies of any other platform, of pcpos-core or of the kernel.
[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
