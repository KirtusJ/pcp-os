[package]
name = "pcpos-kernel"
description = "The PCP OS kernel: a new kernel for x86_64, written in Rust. Early."
version = "0.3.1"
edition = "2021"
authors = ["Kirtus Justus"]
publish = false

[workspace]                               # built on its own, for a bare-metal target

[dependencies]
pcpos-core = { path = "../pcpos-core" }
pcpos-model-media = { path = "../pcpos-model-media", optional = true }

[features]
vm-store = [] # explicitly mounted 64 KiB checkpoint store on a dedicated QEMU PC IDE disk
uefi-demo-heap = [] # 4 MiB heap for the guarded Q35/OVMF demo trial
guest-ethernet = ["virtio-tx-probe"] # raw frames for one explicitly hash-granted ELF
game-link = [] # opt-in COM2 cable for an explicitly hash-granted guest
virtio-tx-probe = []      # one explicitly requested legacy PCI transmit in the isolated QEMU fixture
virtio-rx-probe = ["virtio-tx-probe"] # one TX challenge and one RX completion on the same fixture
virtio-register-probe = ["virtio-rx-probe"] # receive two bounded application attempts in one guest
virtio-worker-probe = ["virtio-rx-probe"] # two isolated guests and one allowlisted user process
no-key-replay-demo = []    # behave as a keyboard controller that does not replay keys: shows what a laptop's may do
lost-key-demo = []         # the controller answers the replay probe and then loses every scripted key: shows that a test fails and does not hang
keyboard-busy-demo = []    # keyboard start-up ends as a controller that did not take its set-up, without touching a port
keyboard-silent-demo = []  # keyboard start-up ends as a keyboard that did not acknowledge, without touching a port
proposals = []           # one hash-granted program may propose one new text file; the kernel asks and creates it
heat = []                  # say at start how many degrees the processor reports below its highest junction temperature (Intel's digital sensor); reads one register, decides nothing
processors = []            # start the machine's other processors and park them (stage 2 of using them all); none runs work yet
processors-extended = ["processors"]      # also start them where firmware left the controller in its extended mode. Run by Director A3 under QEMU 10 only, never on a machine: without this the kernel then stays on one
processors-extended-demo = ["processors-extended"] # under an emulator that offers the extended mode: put the controller in it first, as some firmware leaves it
processors-silent-demo = ["processors"]   # add an identity no processor has: shows that a start that is not answered ends, fails its check and leaves no page behind
processors-unlocked-demo = ["processors"] # the counting check with the kernel's lock not waited for: shows that the check fails when two processors are in at once
companion = []             # one program named by digest runs beside another and the two exchange bytes over dev/talk
model-memory = ["companion", "dep:pcpos-model-media"] # memory a loader filled with a model and named is kept out of the pool and mapped read-only to the companion
model-memory-fixture = ["model-memory"] # EMULATOR ONLY: the line's fixture_model_ram= stands for a loader marking memory in its map; never in a release
high-memory-demo = []      # at start-up, take a run of frames for a device and say where it lies: with memory above four gibibytes present it must still lie below one
vector-state-demo = []     # at start-up, save two different 256-bit register states and load each back: shows that what is saved is what returns
fault-demo = []            # after the self-tests, fault on purpose to show that an unexpected exception is reported and stops the kernel

overflow-demo = []         # after the self-tests, exhaust the stack on purpose to show that it is reported
register-dump = []       # at shutdown, print every line of the kernel's register to the console, for checks that read it

[profile.dev]
panic = "abort"
opt-level = 1
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = "s"
overflow-checks = true
debug = false
