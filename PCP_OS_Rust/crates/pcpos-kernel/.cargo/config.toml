[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
linker = "ld.lld"
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-no-pie", "-C", "link-arg=-Tlinker.ld", "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096"]
