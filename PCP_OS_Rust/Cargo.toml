[workspace]
resolver = "2"
members = ["crates/pcpos-core", "crates/pcpos-pkg", "crates/pcpos-host", "crates/pcpos-gguf"]
exclude = ["crates/pcpos-kernel"]        # built for a bare-metal target with its own settings; see crates/pcpos-kernel/README.md

[workspace.package]
version = "1.0.22"
edition = "2021"
authors = ["Kirtus Justus"]
license-file = "NOTICE.md"
publish = false

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"                        # names of functions are not needed to run it; a refusal or a stop still says why in words
overflow-checks = true                   # integrity over throughput: arithmetic overflow stops the program instead of wrapping
