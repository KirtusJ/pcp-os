[package]
name = "surfbird-cable"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "surfcable"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "none")'.dependencies]
pcp-game-guest = { path = "../../../store/native/guest" }
smoltcp = { version = "0.14", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp"] }

[features]
tcp-ip = ["dep:smoltcp"]

[profile.release]
panic = "abort"
