[package]
name = "surfbird-cable"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "surfcable"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "none")'.dependencies]
pcp-game-guest = { path = "../../../store/native/guest" }
smoltcp = { version = "0.14", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp"] }
rustls = { version = "0.23.46", optional = true, default-features = false }
rustls-rustcrypto = { version = "=0.1.0-pre.0", optional = true, default-features = false, features = ["alloc"] }
webpki-roots = { version = "1.0.12", optional = true }

[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dns", "socket-udp"] }

[features]
local-media = []
tcp-ip = ["dep:smoltcp"]
probe-ethernet-modes = ["tcp-ip"]
dns = ["tcp-ip", "smoltcp/socket-udp", "smoltcp/proto-dns"]
https-probe = ["tcp-ip", "smoltcp/socket-dns", "dep:rustls", "dep:rustls-rustcrypto", "dep:webpki-roots"]

[profile.release]
panic = "abort"
