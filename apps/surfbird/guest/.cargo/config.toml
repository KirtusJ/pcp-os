[target.x86_64-unknown-none]
rustflags = [
  "--cfg", 'getrandom_backend="rdrand"',
  "--cfg", 'curve25519_dalek_backend="serial"',
  "--cfg", 'poly1305_backend="soft"',
  "--cfg", 'polyval_backend="soft"',
  "--cfg", 'chacha20_backend="soft"',
  "--cfg", 'aes_backend="soft"',
  "--cfg", 'sha2_backend="soft"',
  "-C", "relocation-model=static",
  "-C", "code-model=large",
  "-C", "link-arg=-T../../../store/games/flux-rink/guest.ld",
  "-C", "link-arg=--build-id=none",
  "-C", "link-arg=-z",
  "-C", "link-arg=max-page-size=4096",
]
