name: "Kernel async red-green replay"
on:
  push:
    branches: [director-g/validate-kernel-1a7fdd6]
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - rev: 0e068ee44db431f769f901750cbc6ba7c3426bfd
            ok: 58
            fail: 0
            rc: 33
          - rev: c7b5c1950a6137dac77bea1489158c1d65586e57
            ok: 64
            fail: 2
            rc: 35
          - rev: 1a7fdd69da792876376ca1809bb0f8983bcaf67b
            ok: 66
            fail: 0
            rc: 33
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.rev }}
          persist-credentials: false
      - name: Compile the pinned native kernel
        env:
          REVISION: ${{ matrix.rev }}
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 lld binutils
          rustup toolchain install 1.97.0 --profile minimal --component rust-src
          rustc --version
          qemu-system-x86_64 --version
          sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          sha256sum PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32
      - name: Exact boot on two TCG CPUs
        env:
          EXPECTED_RC: ${{ matrix.rc }}
          EXPECTED_PASS: ${{ matrix.ok }}
          EXPECTED_FAIL: ${{ matrix.fail }}
        run: |
          set -euo pipefail
          for cpu in qemu64 max; do
            set +e
            timeout 65s qemu-system-x86_64 -accel tcg -cpu "$cpu" -kernel PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 -m 128M -display none -serial stdio -no-reboot -append then=off -device isa-debug-exit,iobase=0xf4,iosize=0x04 > "$RUNNER_TEMP/$cpu.txt" 2>&1
            rc=$?
            set -e
            cat "$RUNNER_TEMP/$cpu.txt"
            echo "Independent QEMU $cpu exit: $rc"
            test "$rc" = "$EXPECTED_RC"
            test "$(grep -c '^  pass ' "$RUNNER_TEMP/$cpu.txt")" = "$EXPECTED_PASS"
            failed=$(grep -c '^  FAIL ' "$RUNNER_TEMP/$cpu.txt" || true)
            test "$failed" = "$EXPECTED_FAIL"
            grep -q 'kernel register: 43 events' "$RUNNER_TEMP/$cpu.txt"
          done
