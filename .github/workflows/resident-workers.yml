name: Replay Director 1 resident-worker qualification

on:
  pull_request:
    paths:
      - '.github/workflows/resident-workers.yml'

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Director 5's historical readback verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2f46c3b8620efd1c71b90aa0aef2283d8229cac4
          persist-credentials: false
      - name: Verify the archived boot and both rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirtusJ/pcp-os/actions/artifacts/14232439996/zip > "$RUNNER_TEMP/readbacks.zip"
          echo "064455e0c6f883232a566abb1d5c26169083194aa5d1ca946f3b96da3ef18d72  $RUNNER_TEMP/readbacks.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/readbacks.zip" -d "$RUNNER_TEMP/replay"
          for cycle in 1 2; do
            python3 -O examples/resident-workers/verify.py \
              --run "$RUNNER_TEMP/replay/cohort" --oracle "$RUNNER_TEMP/replay/fixture/oracle.json" --cycle "$cycle"
          done
          tail -n 1 "$RUNNER_TEMP/replay/cohort/events.jsonl"
