name: Rust host on desktop platforms

# Builds and tests the hosted Rust workspace (pcpos-core, pcpos-pkg, pcpos-host) on Linux, macOS and
# Windows. The kernel is excluded from the workspace and has its own emulator workflows.
on:
  pull_request:
    paths:
      - 'PCP_OS_Rust/**'
      - '.github/workflows/rust-host.yml'
  push:
    branches: [master]
    paths:
      - 'PCP_OS_Rust/**'
      - '.github/workflows/rust-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        working-directory: PCP_OS_Rust
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RUST_TOOLCHAIN: '1.97.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the toolchain the source was last checked with
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
      - name: Build the host programs from the lock file
        run: cargo build --locked --release
      - name: Regenerate the published vectors and require the tracked files unchanged
        run: |
          cargo run --locked --release --bin pcpos-vectors -- vectors
          git diff --exit-code -- vectors
      - name: Run the workspace tests
        if: runner.os != 'Windows'
        run: cargo test --locked --release --workspace
      # On Windows three host tests fail because of a fault in the host itself (issue 65: repair and the
      # shell-observation writer shorten a file through a handle opened for append). Every other test is
      # required here, so a new failure, a compiler error or changed vectors still fail the job. The three
      # are then run by name in a step that reports its result without deciding the job. When the host is
      # fixed, delete both Windows steps and the condition above. This is not a statement that the host
      # is supported on Windows.
      - name: Run the workspace tests except the three known Windows failures
        if: runner.os == 'Windows'
        run: >
          cargo test --locked --release --workspace --
          --skip what_the_audit_of_november_2026_broke_stays_fixed
          --skip a_check_is_what_the_host_saw_run_or_it_says_it_is_a_report
          --skip a_report_that_does_not_say_in_the_host_s_form_whether_the_command_finished_is_not_kept
      - name: Run the three known Windows failures and report them (issue 65)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: >
          cargo test --locked --release -p pcpos-host --test host --
          what_the_audit_of_november_2026_broke_stays_fixed
          a_check_is_what_the_host_saw_run_or_it_says_it_is_a_report
          a_report_that_does_not_say_in_the_host_s_form_whether_the_command_finished_is_not_kept
      - name: List the instruments in the built program
        run: cargo run --locked --release --bin pcpos -- instrument list
