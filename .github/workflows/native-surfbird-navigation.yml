name: Native Surfbird navigation
on:
  push:
    branches: [director-8/surfbird-navigation-check]
  pull_request:
    paths:
      - 'apps/surfbird/guest/**'
      - '.github/workflows/native-surfbird-navigation.yml'
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install guest build and replay prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 lld python3-scapy
          rustup component add rust-src
          rustup target add x86_64-unknown-none
          rustc -Vv
          qemu-system-x86_64 --version
      - name: Run parser and trace tests
        working-directory: apps/surfbird/guest
        run: |
          cargo test --locked --lib
          /usr/bin/python3 -m unittest discover -p 'test_*.py'
      - name: Build the kernel and the guest
        run: |
          PCPOS_KERNEL_STAGE="$RUNNER_TEMP/kernel-stage" PCPOS_KERNEL_FEATURES=guest-ethernet sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          cd apps/surfbird/guest
          cargo build --locked --release --target x86_64-unknown-none --features tcp-ip
      - name: Replay native keyboard navigation and check the displayed pixels
        working-directory: apps/surfbird/guest
        run: |
          mkdir -p "$RUNNER_TEMP/navigation"
          for arm in fragment allowed; do
            python3 replay.py ../../../PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 target/x86_64-unknown-none/release/surfcable --tcp --arm "$arm" --output "$RUNNER_TEMP/navigation"
          done
      - name: Preserve the serial records and framebuffer captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-surfbird-navigation
          path: ${{ runner.temp }}/navigation
          if-no-files-found: ignore
