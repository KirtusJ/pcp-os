name: Public resident worker Core readback

on:
  pull_request:
    paths:
      - 'examples/method-readback/**'
      - 'examples/resident-workers/**'
      - 'PCP_OS_Rust/crates/pcpos-kernel/**'
      - 'PCP_OS_Rust/crates/pcpos-core/**'
      - 'PCP_OS_Rust/Cargo.toml'
      - 'PCP_OS_Rust/Cargo.lock'
      - 'PCP_OS_Rust/vectors/**'
      - '.github/workflows/public-worker-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out the standalone Enterprise method
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp-os-claude
          ref: c0fbde739b4cc3bc409878d901de0974702c506e
          path: adapter
          sparse-checkout: method
          persist-credentials: false
      - name: Prepare compiler, emulator and external reference inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios binutils lld
          rustup target add x86_64-unknown-none
          rustup component add rust-src
          rustc -Vv
          qemu-system-x86_64 --version
          mkdir inputs
          curl --fail --location --retry 3 'https://huggingface.co/karpathy/tinyllamas/resolve/0bd21da7698eaf29a0d7de3992de8a46ef624add/stories260K/stories260K.bin' -o inputs/checkpoint.bin
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/karpathy/llama2.c/350e04fe35433e6d2941dce5a1f53308f87058eb/run.c' -o inputs/run.c
      - name: Exercise the original and Core-reading workers
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          PCPOS_KERNEL_STAGE: ${{ runner.temp }}/method-worker-kernel
        run: |
          set -euo pipefail
          kernel=PCP_OS_Rust/crates/pcpos-kernel
          sh "$kernel/run.sh" build
          python3 examples/method-readback/public-worker.py \
            --fixture . --fixture-revision "$GITHUB_SHA" \
            --kernel "$kernel/target/pcpos-kernel.elf32" \
            --model inputs/checkpoint.bin --reference inputs/run.c \
            --method adapter/method --out receipts
      - name: Start the Core-reading session cohort
        run: |
          export PCPOS_REAL_QEMU="$(command -v qemu-system-x86_64)"
          export PCPOS_CORE_MODULE="$PWD/receipts/core-spec.md"
          python3 examples/resident-workers/supervise.py \
            --qemu "$PWD/examples/method-readback/qemu-worker" \
            --kernel PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 \
            --worker receipts/resident.elf --oracle receipts/control/oracle.json \
            --run "$RUNNER_TEMP/cohort" --interval 60 --cycles 60 > "$RUNNER_TEMP/resident.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/resident.pid"
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for _ in range(300):
              record = root / "cohort/readback.json"
              if record.exists() and json.loads(record.read_text())["cycle"] >= 2:
                  break
              os.kill(int((root / "resident.pid").read_text()), 0)
              time.sleep(1)
          else:
              raise SystemExit("missing second round")
          PY
          mkdir -p "$RUNNER_TEMP/initial/cohort" "$RUNNER_TEMP/initial/fixture" "$RUNNER_TEMP/initial/controls"
          cp "$RUNNER_TEMP"/cohort/*.serial "$RUNNER_TEMP"/cohort/*.json* "$RUNNER_TEMP/initial/cohort/"
          cp receipts/control/oracle.json receipts/inputs.json "$RUNNER_TEMP/initial/fixture/"
          cp receipts/absent/boot.serial "$RUNNER_TEMP/initial/controls/absent.serial"
          cp receipts/changed/boot.serial "$RUNNER_TEMP/initial/controls/changed.serial"
      - name: Publish two rounds while the workers remain resident
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-resident-first-two-rounds
          path: ${{ runner.temp }}/initial
          if-no-files-found: error
      - name: Continue the native session challenges
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          events = root / "cohort/events.jsonl"
          for _ in range(2000):
              with events.open() as stream:
                  rows = [json.loads(line) for line in stream if line.endswith("\n")]
              if rows and rows[-1]["event"] == "finished":
                  if json.loads((root / "cohort/readback.json").read_text())["cycle"] != 60:
                      raise SystemExit("cohort ended early")
                  break
              if rows and rows[-1]["event"] in ("failed", "stopped"):
                  raise SystemExit(str(rows[-1]))
              os.kill(int((root / "resident.pid").read_text()), 0)
              time.sleep(2)
          else:
              raise SystemExit("final readback deadline")
          PY
      - name: Preserve the final session record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-resident-final-rounds
          path: |
            ${{ runner.temp }}/cohort/*.serial
            ${{ runner.temp }}/cohort/*.json*
            ${{ runner.temp }}/cohort/*.stderr
            ${{ runner.temp }}/resident.log
          if-no-files-found: warn
      - name: Retain the oracle, serial logs and cohort receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resident-worker-core-readback
          path: |
            receipts/**/*.serial
            receipts/**/*.stderr
            receipts/**/events.jsonl
            receipts/**/readback.json
            receipts/control/oracle.json
            receipts/inputs.json
          if-no-files-found: warn
          retention-days: 14
