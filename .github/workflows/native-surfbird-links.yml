name: Native Surfbird links
on:
  pull_request:
    paths:
      - 'apps/surfbird/guest/**'
      - 'store/native/guest/src/device.rs'
      - 'store/native/guest/tests/display_present.rs'
      - '.github/workflows/native-surfbird-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install guest build and replay prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios lld python3-scapy
          rustup component add rust-src
          rustup target add x86_64-unknown-none
      - name: Test guest display presentation
        run: cargo test --offline --manifest-path store/native/guest/Cargo.toml --test display_present
      - name: Check the guest parser and capture verifier
        working-directory: apps/surfbird/guest
        run: |
          cargo test --locked --lib
          /usr/bin/python3 -m unittest discover -p 'test_*.py'
      - name: Build the Ethernet kernel and native reader
        run: |
          PCPOS_KERNEL_STAGE="$RUNNER_TEMP/kernel-stage" PCPOS_KERNEL_FEATURES=guest-ethernet sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          cd apps/surfbird/guest
          cargo build --locked --release --target x86_64-unknown-none --features tcp-ip
      - name: Follow links with the guest keyboard and verify the HTTP capture
        working-directory: apps/surfbird/guest
        run: |
          mkdir -p "$RUNNER_TEMP/navigation"
          for arm in order history focus fragment allowed; do
            python3 replay.py ../../../PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 target/x86_64-unknown-none/release/surfcable --tcp --arm "$arm" --output "$RUNNER_TEMP/navigation"
          done
      - name: Retain packet, display and serial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-surfbird-links
          path: ${{ runner.temp }}/navigation
          if-no-files-found: ignore
