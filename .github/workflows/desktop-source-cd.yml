name: Qualify a source-built BIOS CD on desktop hosts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Same-repository run containing the unpublished-tester-cd artifact
        type: string
        required: true
      iso_sha256:
        description: Independently verified SHA-256 of the complete ISO
        type: string
        required: true
      kernel_measurement:
        description: Independently calculated kernel text and read-only data measurement
        type: string
        required: true
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      iso_sha256:
        required: true
        type: string
      kernel_measurement:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ISO_DIGEST: ${{ inputs.iso_sha256 }}
      KERNEL_MEASUREMENT: ${{ inputs.kernel_measurement }}
    steps:
      - name: Read the portable optical checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp
          ref: 802bf8aacbf4fb573e3baef684295089edd77c6c
          path: checker
          persist-credentials: false
      - name: Fetch the image from the selected run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: unpublished-tester-cd
          path: media
      - name: Install QEMU and SeaBIOS on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 seabios
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew list --versions qemu >/dev/null || brew install qemu
      - name: Install native Windows QEMU
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-qemu
      - name: Verify and boot the image on Linux or macOS
        if: runner.os != 'Windows'
        run: |
          python3 checker/audit/public-live-cd/check_host_boot.py media/pcp-os-tester.iso desktop-evidence \
            --source-build "$ISO_DIGEST" "$KERNEL_MEASUREMENT"
      - name: Verify and boot the image on Windows
        if: runner.os == 'Windows'
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $python = (Get-Command python.exe).Source
          $bin = Join-Path $env:MSYS_ROOT 'ucrt64/bin'
          $env:PATH = "$bin;$env:PATH"
          & $python checker/audit/public-live-cd/check_host_boot.py media/pcp-os-tester.iso desktop-evidence --qemu "$bin/qemu-system-x86_64.exe" --source-build $env:ISO_DIGEST $env:KERNEL_MEASUREMENT
      - name: Retain the original observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-bios-${{ matrix.os }}
          path: desktop-evidence/
          if-no-files-found: warn
          retention-days: 30
