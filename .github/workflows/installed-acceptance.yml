name: Installed acceptance checker tests

on:
  pull_request:
    paths:
      - 'os-docs/installed-acceptance/**'
      - 'os-docs/tailorbird-stop/**'
      - 'PCP_OS_Rust/crates/pcpos-kernel/src/font.rs'
      - 'PCP_OS_Rust/crates/pcpos-kernel/tools/measure.py'
      - '.github/workflows/installed-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Tailorbird task receipts and rendered output
        run: |
          python3 -m unittest discover -s os-docs/tailorbird-stop -v
          python3 -O -m unittest discover -s os-docs/tailorbird-stop -v
      - name: Get the recorded installed Tailorbird run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 179c7f455a82f3508232b555fd7f74689083d83a
          path: installed-evidence
          sparse-checkout: raw
          persist-credentials: false
      - name: Replay the installed captures with standard and optimized Python
        run: |
          python3 installed-evidence/raw/replay.py os-docs/tailorbird-stop
          python3 -O installed-evidence/raw/replay.py os-docs/tailorbird-stop
      - name: Install disk fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mtools util-linux
          for tool in mformat mmd mcopy partx; do command -v "$tool"; done
      - name: Check transcripts, result recording and disk fixtures
        run: |
          python3 -m unittest discover -s os-docs/installed-acceptance -v
          python3 -O -m unittest discover -s os-docs/installed-acceptance -v
