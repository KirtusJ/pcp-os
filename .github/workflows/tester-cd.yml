name: Tester CD from source

# Builds the BIOS tester CD from this commit twice, requires the same image both times, and boots it on two
# machine types and two clocks. Nothing here publishes an image.
on:
  pull_request:
    paths:
      - 'examples/tester-cd/**'
      - 'examples/optical-disk-check/check.py'
      - 'examples/optical-disk-check/check_compact_verification.py'
      - 'PCP_OS_Rust/crates/pcpos-kernel/**'
      - 'PCP_OS_Rust/crates/pcpos-core/**'
      - 'apps/surfbird/guest/**'
      - 'store/native/guest/**'
      - 'store/apps/parrots-all-the-way-down/guest/**'
      - 'store/apps/parrots-all-the-way-down/core/**'
      - '.github/workflows/tester-cd.yml'
  push:
    branches: [master]
    paths:
      - 'examples/tester-cd/**'
      - 'examples/optical-disk-check/check.py'
      - 'examples/optical-disk-check/check_compact_verification.py'
      - 'PCP_OS_Rust/crates/pcpos-kernel/**'
      - 'PCP_OS_Rust/crates/pcpos-core/**'
      - 'apps/surfbird/guest/**'
      - 'store/native/guest/**'
      - 'store/apps/parrots-all-the-way-down/guest/**'
      - 'store/apps/parrots-all-the-way-down/core/**'
      - '.github/workflows/tester-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - option: ''
            suffix: ''
          - option: '--queue-desk'
            suffix: '-queue-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # On a pull request the default checkout is a merge commit that GitHub makes for the test and later
      # drops, so a receipt naming it names nothing anyone can fetch. Build the pull request's own head
      # commit; on a push to master this is the pushed commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the pinned Limine 10.8.5 binary release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Limine-Bootloader/Limine
          ref: 7a9013f305de0bea1f6310e76e7baba30499fef0
          path: upstream-loader
          persist-credentials: false
      - name: Install the build and emulator tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 seabios xorriso lld
          rustup toolchain install 1.97.0 --profile minimal --no-self-update -c rust-src -t x86_64-unknown-none
      - name: Build the CD twice and require the same image
        run: |
          python3 -B examples/tester-cd/build.py ${{ matrix.option }} upstream-loader "$RUNNER_TEMP/first"
          python3 -B examples/tester-cd/build.py ${{ matrix.option }} upstream-loader "$RUNNER_TEMP/a-second-directory"
          cmp "$RUNNER_TEMP/first/pcp-os-tester.iso" "$RUNNER_TEMP/a-second-directory/pcp-os-tester.iso"
          cat "$RUNNER_TEMP/first/receipt.json"
      - name: Boot it on pc and q35, on both clocks
        run: python3 -B examples/tester-cd/check.py ${{ matrix.option }} "$RUNNER_TEMP/first" "$RUNNER_TEMP/evidence"
      - name: Check compact F5 on the CD at 800 by 600 and its measured kernel at 1024 by 768
        if: matrix.option == ''
        run: python3 -IB examples/optical-disk-check/check_compact_verification.py "$RUNNER_TEMP/first" "$RUNNER_TEMP/evidence/compact-f5"
      - name: Fill the small-display desktop with fourteen pins at 640 by 480 and 320 by 200
        if: matrix.option == ''
        run: python3 -IB examples/tester-cd/check_compact_pins.py "$RUNNER_TEMP/first" "$RUNNER_TEMP/evidence/compact-pins"
      - name: Settings and the small list of programs at small and crossed sizes
        if: matrix.option == ''
        run: python3 -IB examples/tester-cd/check_small_screens.py "$RUNNER_TEMP/first" "$RUNNER_TEMP/evidence/small-screens"
      - name: A keyboard controller that does not replay keys
        if: matrix.option == ''
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          cd PCP_OS_Rust/crates/pcpos-kernel
          PCPOS_KERNEL_STAGE="$RUNNER_TEMP/default-kernel" sh run.sh build
          cp target/pcpos-kernel.elf32 "$RUNNER_TEMP/default.elf32"
          python3 -IB tests/no_serial.py "$RUNNER_TEMP/default.elf32"
          PCPOS_KERNEL_STAGE="$RUNNER_TEMP/no-replay-kernel" PCPOS_KERNEL_FEATURES=no-key-replay-demo sh run.sh build
          cp target/pcpos-kernel.elf32 "$RUNNER_TEMP/no-replay.elf32"
          PCPOS_KERNEL_STAGE="$RUNNER_TEMP/lost-key-kernel" PCPOS_KERNEL_FEATURES=lost-key-demo sh run.sh build
          python3 -IB tests/replay_probe.py "$RUNNER_TEMP/default.elf32" "$RUNNER_TEMP/no-replay.elf32" --lost-keys target/pcpos-kernel.elf32
          cd "$GITHUB_WORKSPACE"
          python3 -IB examples/tester-cd/check_stopped_screen.py "$RUNNER_TEMP/default.elf32" "$RUNNER_TEMP/no-replay.elf32" "$RUNNER_TEMP/evidence/stopped-screen"
      - name: Replay selected grants and RGB controls on the native captures
        run: python3 -IB examples/tester-cd/check_launcher_grants.py "$RUNNER_TEMP/first/receipt.json" "$RUNNER_TEMP/evidence"
      - name: Check the source CD beside disposable IDE and NVMe disks
        if: matrix.option == ''
        run: |
          cd "$RUNNER_TEMP/first"
          checker="$GITHUB_WORKSPACE/examples/optical-disk-check/check.py"
          sha=$(jq -er .iso_sha256 receipt.json)
          kernel=$(jq -er .kernel_measurement receipt.json)
          evidence="$RUNNER_TEMP/evidence"
          python3 -IB "$checker" pcp-os-tester.iso "$evidence/disk-ide" --tester-profile --sha256 "$sha" --kernel "$kernel"
          for sector in 512 4096; do
            python3 -IB "$checker" pcp-os-tester.iso "$evidence/disk-nvme-$sector" --tester-profile \
              --sha256 "$sha" --kernel "$kernel" --nvme-sector-size "$sector"
          done
      - name: Keep the receipt and the evidence, including a failed case
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tester-cd-evidence${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/first/receipt.json
            ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the unpublished image that was tested
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-tester-cd${{ matrix.suffix }}
          path: ${{ runner.temp }}/first/pcp-os-tester.iso
          retention-days: 14
