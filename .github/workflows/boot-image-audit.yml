name: PCP OS kernel ELF conversion structural verification

on:
  pull_request:
    paths:
      - 'PCP_OS_Rust/crates/pcpos-kernel/tools/boot_image_audit.py'
      - 'PCP_OS_Rust/crates/pcpos-kernel/tests/test_boot_image_audit.py'
      - '.github/workflows/boot-image-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact pull-request source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Provision documented linker and objcopy on ephemeral CI runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ld.lld >/dev/null 2>&1 || ! command -v objcopy >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends lld binutils
          fi
          command -v ld.lld
          command -v objcopy
      - name: Print exact source and toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
          python3 --version
          ld.lld --version
          objcopy --version | head -1
      - name: Execute synthetic positive and adverse ELF checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s PCP_OS_Rust/crates/pcpos-kernel/tests -p test_boot_image_audit.py -v
      - name: Install official freestanding Rust source and target in CI
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rust-src
          rustup target add x86_64-unknown-none
      - name: Build current product ELF64 and Multiboot ELF32 without booting
        shell: bash
        env:
          PCPOS_KERNEL_STAGE: ${{ runner.temp }}/pcpos-kernel-build
        run: |
          set -euo pipefail
          sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
      - name: Audit both actual image files, ELF class, load segments and SHA-256
        shell: bash
        env:
          PCPOS_KERNEL_STAGE: ${{ runner.temp }}/pcpos-kernel-build
        run: |
          set -euo pipefail
          ELF64="$PCPOS_KERNEL_STAGE/crates/pcpos-kernel/target/x86_64-unknown-none/release/pcpos-kernel"
          ELF32="PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32"
          test -s "$ELF64"
          test -s "$ELF32"
          readelf -h "$ELF64" | head -27
          readelf -h "$ELF32" | head -27
          sha256sum "$ELF64" "$ELF32"
          python3 PCP_OS_Rust/crates/pcpos-kernel/tools/boot_image_audit.py "$ELF64" "$ELF32"
