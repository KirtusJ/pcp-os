name: Guarded UEFI kernel experiment
on:
  pull_request:
    paths:
      - 'PCP_OS_Rust/crates/pcpos-kernel/**'
      - 'examples/guarded-uefi/**'
      - 'examples/firmware-owned-uefi/load-base.patch'
      - 'examples/heat/**'
      - 'examples/processors/**'
      - 'examples/vector-state/**'
      - '.github/workflows/guarded-uefi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_THREAD_LIMIT: '1'
      PCPOS_KERNEL_FEATURES: uefi-demo-heap
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp
          ref: b15e346cd9cdae483ebe1dad477e189bfa25464a
          path: distribution
          persist-credentials: false
      - name: Install firmware, boot tools and compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld ovmf qemu-system-x86 grub-common grub-efi-amd64-bin xorriso mtools dosfstools tesseract-ocr
          rustup toolchain install 1.100.0 --profile minimal --component rust-src
      - name: The relocation patch of the firmware recipe still applies to this kernel
        run: git apply --check examples/firmware-owned-uefi/load-base.patch
      - name: Check the frame selector and build the demo kernel
        run: |
          rustc --edition=2021 --test examples/guarded-uefi/test_frame_map.rs -o "$RUNNER_TEMP/frame-map-tests"
          "$RUNNER_TEMP/frame-map-tests"
          rustc --edition=2021 --test -C overflow-checks=on examples/heat/test_heat.rs -o "$RUNNER_TEMP/heat-tests"
          "$RUNNER_TEMP/heat-tests"
          rustc --edition=2021 --test -C overflow-checks=on examples/processors/test_processors.rs -o "$RUNNER_TEMP/processor-table-tests"
          "$RUNNER_TEMP/processor-table-tests"
          bash PCP_OS_Rust/crates/pcpos-kernel/run.sh build
      - name: Check the default 16 MiB heap kernel on BIOS
        shell: bash # with this GitHub adds pipefail, so the checker's failure is not lost in the pipe to tee (A3)
        run: |
          kernel=PCP_OS_Rust/crates/pcpos-kernel
          cp "$kernel/target/pcpos-kernel.elf32" "$RUNNER_TEMP/uefi-demo.elf32"
          PCPOS_KERNEL_FEATURES= bash "$kernel/run.sh" build
          export DEFAULT_KERNEL="$kernel/target/pcpos-kernel.elf32"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          kernel = Path(os.environ["DEFAULT_KERNEL"])
          measure = kernel.parent.parent / "tools/measure.py"
          digest = subprocess.check_output(["python3", measure, kernel], text=True).strip()
          out = Path(os.environ["RUNNER_TEMP"], "default-bios.txt")
          with out.open("wb") as serial:
              result = subprocess.run(["qemu-system-x86_64", "-machine", "pc", "-accel", "tcg",
                  "-cpu", "max", "-m", "128M", "-smp", "1", "-nic", "none", "-display", "none",
                  "-monitor", "none", "-serial", "stdio", "-audiodev", "none,id=s",
                  "-device", "AC97,audiodev=s", "-icount", "shift=3,align=off,sleep=off",
                  "-no-reboot", "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
                  "-kernel", kernel, "-append", "image=" + digest + " then=off"], stdout=serial, timeout=90)
          log = out.read_text()
          if result.returncode != 33 or "ALL SELF-TESTS PASS." not in log or digest + " (measured; equal" not in log:
              raise SystemExit("Default BIOS regression failed")
          PY
          python3 examples/guarded-uefi/default_optical.py distribution "$kernel" "$RUNNER_TEMP/default-optical"
          # The count of processors the kernel reads from firmware, on machines of 1 to 8, and the words it refuses.
          python3 examples/processors/check.py "$DEFAULT_KERNEL" | tee "$RUNNER_TEMP/processors.txt"
          cp "$RUNNER_TEMP/uefi-demo.elf32" "$kernel/target/pcpos-kernel.elf32"
      - name: Start the other processors and park them (feature processors, off by default)
        shell: bash # pipefail: the checker's failure is not lost in the pipe to tee
        run: |
          kernel=PCP_OS_Rust/crates/pcpos-kernel
          for features in "" processors processors-extended-demo processors-silent-demo processors-unlocked-demo; do
            PCPOS_KERNEL_FEATURES="$features" bash "$kernel/run.sh" build
            cp "$kernel/target/pcpos-kernel.elf32" "$RUNNER_TEMP/kernel-${features:-plain}.elf32"
          done
          python3 examples/processors/check_started.py "$RUNNER_TEMP/kernel-processors.elf32" "$RUNNER_TEMP/kernel-plain.elf32" \
            "$RUNNER_TEMP/kernel-processors-extended-demo.elf32" "$RUNNER_TEMP/kernel-processors-silent-demo.elf32" \
            "$RUNNER_TEMP/kernel-processors-unlocked-demo.elf32" | tee "$RUNNER_TEMP/processors-started.txt"
          # The Details screen shows the same sentences, for a machine with no serial connector.
          PCPOS_KERNEL_FEATURES="processors,heat" bash "$kernel/run.sh" build
          cp "$kernel/target/pcpos-kernel.elf32" "$RUNNER_TEMP/kernel-processors-heat.elf32"
          python3 examples/processors/check_details.py "$RUNNER_TEMP/kernel-plain.elf32" "$RUNNER_TEMP/kernel-processors-heat.elf32" \
            "$RUNNER_TEMP/details-machine" | tee "$RUNNER_TEMP/details-machine.txt"
          cp "$RUNNER_TEMP/uefi-demo.elf32" "$kernel/target/pcpos-kernel.elf32"
      - name: Check the released ELF and guard the experimental handoff
        run: python3 examples/guarded-uefi/trial.py distribution PCP_OS_Rust/crates/pcpos-kernel "$RUNNER_TEMP/guarded-uefi"
      - name: A program starts with its vector registers empty and every floating-point exception masked
        shell: bash # pipefail: the checker's failure is not lost in the pipe to tee
        run: |
          kernel=PCP_OS_Rust/crates/pcpos-kernel
          rustup target add x86_64-unknown-none
          mkdir "$RUNNER_TEMP/vector"
          PCPOS_KERNEL_FEATURES="" bash "$kernel/run.sh" build
          cp "$kernel/target/pcpos-kernel.elf32" "$RUNNER_TEMP/vector/kernel.elf32"
          (cd examples/vector-state/probe && LEAVE=1 cargo build --locked --release --target x86_64-unknown-none --target-dir "$RUNNER_TEMP/vector/leave")
          (cd examples/vector-state/probe && cargo build --locked --release --target x86_64-unknown-none --target-dir "$RUNNER_TEMP/vector/look")
          cp "$RUNNER_TEMP/vector/leave/x86_64-unknown-none/release/vector-probe" "$RUNNER_TEMP/vector/vector-leave"
          cp "$RUNNER_TEMP/vector/look/x86_64-unknown-none/release/vector-probe" "$RUNNER_TEMP/vector/vector-look"
          python3 examples/vector-state/check.py "$RUNNER_TEMP/vector/kernel.elf32" "$RUNNER_TEMP/vector/vector-leave" \
            "$RUNNER_TEMP/vector/vector-look" | tee "$RUNNER_TEMP/vector-state.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-uefi-boot
          path: |
            ${{ runner.temp }}/guarded-uefi
            ${{ runner.temp }}/default-bios.txt
            ${{ runner.temp }}/processors.txt
            ${{ runner.temp }}/processors-started.txt
            ${{ runner.temp }}/vector-state.txt
            ${{ runner.temp }}/details-machine.txt
            ${{ runner.temp }}/default-optical
          if-no-files-found: warn
          retention-days: 14
