name: Program pictures in the list of programs
on:
  pull_request:
    paths:
      - 'PCP_OS_Rust/crates/pcpos-kernel/**'
      - 'examples/program-pictures/**'
      - 'examples/optical-disk-check/check.py'
      - 'examples/tester-cd/check_compact_pins.py'
      - '.github/workflows/program-pictures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pictures:
    name: Shown by digest, never by name
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The proposed merge with master, which is what the other jobs here test, and not the branch's
      # own head: a branch that predates this check has no check.py at its head, and the job then
      # failed on changes that had nothing to do with it (the kernel session, on pull request 428).
      - name: Check out the proposed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the compiler's sources, the linker and the emulator
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src --target x86_64-unknown-none
          rustup default 1.97.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 lld binutils
      - name: Build the kernel with its default features
        run: sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
      - name: Eleven predicates on nine boots
        run: python3 -B examples/program-pictures/check.py PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 "$RUNNER_TEMP/program-pictures"
      - name: Keep the frames, the text read and the serial logs, also on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: program-pictures
          path: ${{ runner.temp }}/program-pictures
          if-no-files-found: warn
          retention-days: 14
