name: PCP OS IDE device-role boundary witness

on:
  pull_request:
    paths:
      - '.github/workflows/ide-role-boundary.yml'
      - 'PCP_OS_Rust/crates/pcpos-kernel/tools/store_role_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-two-disk-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact authored PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record source and compiler identities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
          python3 --version
      - name: Provision ephemeral bare-metal compiler and emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld binutils qemu-system-x86 clang
          rustup component add rust-src
          rustup target add x86_64-unknown-none
          ld.lld --version
          objcopy --version | head -1
          qemu-system-x86_64 --version | head -1
      - name: Compile exact PR119-derived kernel ELF; do not boot yet
        shell: bash
        env:
          PCPOS_KERNEL_STAGE: \${{ runner.temp }}/pcpos-ide-role-kernel
        run: |
          set -euo pipefail
          sh PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          KERNEL=PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32
          test -s "$KERNEL"
          sha256sum "$KERNEL"
          readelf -h "$KERNEL" | grep -E 'Class:|Machine:|Entry point address:'
      - name: Two-disk positive, missing-device and copied-marker adverse QEMU fixtures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ide-role-test-only"
          test ! -e "$ROOT"
          python3 PCP_OS_Rust/crates/pcpos-kernel/tools/store_role_probe.py \
            --kernel PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 \
            --out "$ROOT" \
            --timeout 120 \
            --objcopy objcopy
          # Files exist exclusively under RUNNER_TEMP. No host disks or
          # production QEMU images are ever attached to this test.
          find "$ROOT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
