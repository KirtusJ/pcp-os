name: PCP OS Rust host checks

on:
  pull_request:
    paths:
      - "PCP_OS_Rust/**"
      - ".github/workflows/rust-host-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PCP_OS_Rust
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install source-release Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustc --version
      - name: Generate native published guard vectors
        run: cargo run --locked --release --bin pcpos-vectors -- vectors
      - name: Test all workspace crates
        run: cargo test --locked --workspace
      - name: Compile release host binary
        run: cargo build --locked --release --bin pcpos
