name: Tailorbird native guest source and ELF checks

on:
  pull_request:
    paths:
      - 'apps/tailorbird/guest/**'
      - '.github/workflows/tailorbird-guest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-ui-and-native-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record source and toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
      - name: Execute unit and adverse UI reducer tests in debug
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --lib --manifest-path apps/tailorbird/guest/Cargo.toml -- --nocapture
      - name: Execute unit and adverse UI reducer tests in release
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --release --lib --manifest-path apps/tailorbird/guest/Cargo.toml -- --nocapture
      - name: Install official x86_64 freestanding Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-none
      - name: Provision documented linker and ELF inspection
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ld.lld >/dev/null 2>&1 || ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends lld binutils
          fi
          ld.lld --version
          readelf --version | head -1
      - name: Compile native no_std guest ELF64 without launching it
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
        run: |
          set -euo pipefail
          cargo build --offline --release --target x86_64-unknown-none \
            --manifest-path apps/tailorbird/guest/Cargo.toml
      - name: Inspect exact ELF64 output and hash
        shell: bash
        run: |
          set -euo pipefail
          ELF="apps/tailorbird/guest/target/x86_64-unknown-none/release/tailorbird"
          test -s "$ELF"
          readelf -h "$ELF"
          readelf -l "$ELF"
          sha256sum "$ELF"
          git rev-parse HEAD
