[package]
name = "parrots-all-the-way-down"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
recursion-desk-core = { path = "../core" }
pcp-game-guest = { path = "../../../native/guest" }

[[bin]]
name = "rdesk"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
strip = "symbols"
